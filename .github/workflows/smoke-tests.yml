name: DE_Portal test Report

on:
  schedule:
    - cron: "30 3 * * 1-5" # 9:00 AM IST, Monday–Friday
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Install additional tools
        run: sudo apt-get update && sudo apt-get install -y bc jq

      - name: Validate required secrets
        run: |
          echo "Validating essential secrets..."
          if [ -z "${{ secrets.TEAMS_WEBHOOK_URL }}" ]; then
            echo "⚠️ Warning: TEAMS_WEBHOOK_URL secret not configured"
          else
            echo "✅ TEAMS_WEBHOOK_URL configured"
          fi

          if [ -z "${{ secrets.VALID_EMAIL }}" ]; then
            echo "⚠️ Warning: VALID_EMAIL secret not configured - tests may use defaults"
          else
            echo "✅ VALID_EMAIL configured"
          fi

          if [ -z "${{ secrets.BASE_URL }}" ]; then
            echo "⚠️ Warning: BASE_URL secret not configured - tests may use defaults"
          else
            echo "✅ BASE_URL configured"
          fi

          echo "Validation complete - proceeding with tests"

      - name: Run Playwright smoke tests with HTML + JSON report
        id: tests
        continue-on-error: true 
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          NODE_ENV: ${{ secrets.NODE_ENV || 'test' }}
          TEST_ENV: ${{ secrets.TEST_ENV || 'dev' }}

          # Authentication Credentials
          VALID_EMAIL: ${{ secrets.VALID_EMAIL }}
          VALID_PASSWORD: ${{ secrets.VALID_PASSWORD }}
          INVALID_EMAIL: ${{ secrets.INVALID_EMAIL }}
          INVALID_PASSWORD: ${{ secrets.INVALID_PASSWORD }}

          # Database Configuration
          PROCEDURE_NAME: ${{ secrets.PROCEDURE_NAME }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          SCHEMA_NAME: ${{ secrets.SCHEMA_NAME }}
          FULLY_QUALIFIED_NAME: ${{ secrets.FULLY_QUALIFIED_NAME }}
          TEST_PROCEDURE_NAME: ${{ secrets.TEST_PROCEDURE_NAME }}

          # Tableau Configuration
          TABLEAU_SERVER_URL: ${{ secrets.TABLEAU_SERVER_URL }}
          TABLEAU_SITE_ID: ${{ secrets.TABLEAU_SITE_ID }}
          TABLEAU_DASHBOARD_NAME: ${{ secrets.TABLEAU_DASHBOARD_NAME }}
          LARGE_TABLEAU_DASHBOARD_NAME: ${{ secrets.LARGE_TABLEAU_DASHBOARD_NAME }}
          INVALID_TABLEAU_SERVER_URL: ${{ secrets.INVALID_TABLEAU_SERVER_URL }}
          INVALID_TABLEAU_SITE_ID: ${{ secrets.INVALID_TABLEAU_SITE_ID }}
          INVALID_TABLEAU_DASHBOARD_NAME: ${{ secrets.INVALID_TABLEAU_DASHBOARD_NAME }}

          # PDF Configuration
          DEFAULT_PDF_PREFIX: ${{ secrets.DEFAULT_PDF_PREFIX }}
          DEFAULT_PDF_SUFFIX: ${{ secrets.DEFAULT_PDF_SUFFIX }}

          # Debug and CI Configuration
          DEBUG: ${{ secrets.DEBUG || 'false' }}
          CI: "true"
        run: |
          echo "🚀 Starting Playwright test execution..."
          mkdir -p reports
          
          # Run tests with explicit result generation
          TEST_EXIT_CODE=0
          npx playwright test --grep @smoke || TEST_EXIT_CODE=$?
          
          echo "Tests completed with exit code: $TEST_EXIT_CODE"

          ts=$(date +'%Y-%m-%d_%H-%M-%S')
          mkdir -p "reports/$ts"

          # Always move/create HTML report
          if [ -d "playwright-report" ]; then
            echo "✅ HTML report found, moving to reports/$ts"
            mv playwright-report "reports/$ts"
          else
            echo "⚠️ No HTML report generated, creating placeholder"
            mkdir -p "reports/$ts"
            echo "<html><body><h1>Test Execution Failed</h1><p>No HTML report was generated. Check logs for details.</p></body></html>" > "reports/$ts/index.html"
          fi

          # Always move/create JSON results
          if [ -f "results.json" ]; then
            echo "✅ JSON results found, moving to reports/$ts"
            mv results.json "reports/$ts/results.json"
          else
            echo "⚠️ No results.json found, creating fallback results"
            # Create a proper failure result structure
            cat > "reports/$ts/results.json" << EOF
          {
            "config": {
              "rootDir": "$PWD",
              "configFile": "$PWD/playwright.config.js"
            },
            "suites": [],
            "errors": [
              {
                "message": "Test execution failed before results could be generated",
                "location": {
                  "file": "GitHub Workflow",
                  "line": 1
                }
              }
            ],
            "stats": {
              "startTime": "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)",
              "duration": 0,
              "expected": 0,
              "unexpected": 1,
              "flaky": 0,
              "skipped": 0
            }
          }
          EOF
          fi

          # Also create JUnit XML if it exists
          if [ -f "test-results.xml" ]; then
            echo "✅ JUnit XML found, moving to reports/$ts"
            mv test-results.xml "reports/$ts/test-results.xml"
          fi

          echo "REPORT_TS=$ts" >> $GITHUB_ENV
          echo "TEST_EXIT_CODE=$TEST_EXIT_CODE" >> $GITHUB_ENV

      - name: Deploy Playwright reports to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always() # Always deploy reports, even if tests failed
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports
          publish_branch: gh-pages
          keep_files: true # keep older reports instead of deleting them

      - name: Parse results and send summary to Teams
        if: always() # Always send Teams notification, regardless of test outcome
        run: |
          RESULTS_FILE="reports/$REPORT_TS/results.json"

          # Check if results file exists and has actual test data
          if [ ! -f "$RESULTS_FILE" ]; then
            echo "Results file not found, sending failure notification"
            if [ -z "${{ secrets.TEAMS_WEBHOOK_URL }}" ]; then
              echo "Warning: TEAMS_WEBHOOK_URL secret not configured"
              exit 0
            fi
            curl -H 'Content-Type: application/json' \
              -d "{\"text\": \"🚨 **DE_Portal Test Results**\n\n❌ Test execution failed - no results available\n🕐 Time: $(date)\n🔗 [View Workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\"}" \
              "${{ secrets.TEAMS_WEBHOOK_URL }}"
            exit 0
          fi

          echo "✅ Results file found. First 30 lines:"
          head -30 "$RESULTS_FILE"
          echo "--- End debug info ---"

          # Check if it's a placeholder file (created when tests fail early)
          TOTAL_FROM_STATS=$(jq -r '.stats.expected + .stats.unexpected + .stats.flaky // 0' $RESULTS_FILE 2>/dev/null || echo "0")

          if [ "$TOTAL_FROM_STATS" -eq 0 ]; then
            echo "Empty or invalid results file, checking for actual test results"
            # Try the robust method to count actual test results
            ACTUAL_TESTS=$(jq '[.. | objects | select(.status? != null)] | length' $RESULTS_FILE 2>/dev/null || echo "0")
            
            if [ "$ACTUAL_TESTS" -eq 0 ]; then
              echo "No actual test results found, sending failure notification"
              if [ -z "${{ secrets.TEAMS_WEBHOOK_URL }}" ]; then
                echo "Warning: TEAMS_WEBHOOK_URL secret not configured"
                exit 0
              fi
              curl -H 'Content-Type: application/json' \
                -d "{\"text\": \"🚨 **DE_Portal Test Results**\n\n❌ Test execution failed - no test results found\n🕐 Time: $(date)\n🔗 [View Workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\"}" \
                "${{ secrets.TEAMS_WEBHOOK_URL }}"
              exit 0
            fi
          fi

          # Use stats-based parsing to match HTML report exactly
          TOTAL_TESTS=$(jq -r '.stats.expected + .stats.unexpected + .stats.flaky + .stats.skipped' $RESULTS_FILE)
          PASSED_TESTS=$(jq -r '.stats.expected // 0' $RESULTS_FILE)
          FAILED_TESTS=$(jq -r '.stats.unexpected // 0' $RESULTS_FILE)
          FLAKY_TESTS=$(jq -r '.stats.flaky // 0' $RESULTS_FILE)
          SKIPPED_TESTS=$(jq -r '.stats.skipped // 0' $RESULTS_FILE)
          DURATION=$(jq -r '.stats.duration // 0' $RESULTS_FILE)

          # Convert duration to seconds and minutes using jq for better reliability  
          DURATION_SEC=$(jq -r "(.stats.duration // 0) / 1000 * 10 | floor / 10" $RESULTS_FILE)
          DURATION_MIN=$(jq -r "(.stats.duration // 0) / 60000 * 10 | floor / 10" $RESULTS_FILE)

          # Determine status and emoji
          if [ "$FAILED_TESTS" -eq 0 ] && [ "$FLAKY_TESTS" -eq 0 ]; then
            STATUS="✅ All Tests Passed"
            EMOJI="🎉"
          elif [ "$FAILED_TESTS" -gt 0 ]; then
            STATUS="❌ Tests Failed"
            EMOJI="🚨"
          else
            STATUS="⚠️ Flaky Tests Detected"
            EMOJI="⚠️"
          fi

          # Get test summary with status - using correct spec-based approach
          summary=$(jq -r '
            .suites[].suites[]?.specs[] // empty | 
            select(.title) |
            if .ok == true and (.tests[].results | map(.status) | all(. == "passed")) then
              "• " + .title + " → ✅ passed"
            elif .ok == false or (.tests[].results | map(.status) | any(. == "failed")) then
              "• " + .title + " → ❌ failed"  
            elif .ok == true and (.tests[].results | map(.status) | any(. == "flaky")) then
              "• " + .title + " → ⚠️ flaky"
            else
              "• " + .title + " → ❓ unknown"
            end
          ' $RESULTS_FILE 2>/dev/null | head -15)

          # Fallback to simple spec listing if complex status parsing fails
          if [ -z "$summary" ]; then
            echo "Complex status parsing failed, falling back to simple spec listing"
            summary=$(jq -r '
              .suites[].suites[]?.specs[] // empty | 
              select(.title) |
              "• " + .title
            ' $RESULTS_FILE 2>/dev/null | head -15)
          fi

          # If we still have no summary, create a basic one
          if [ -z "$summary" ]; then
            echo "All spec parsing failed, using fallback summary"
            summary="• Tests executed - see full report for details"
          fi

          # Convert to proper Teams format with line breaks for list items
          summary=$(echo "$summary" | sed ':a;N;$!ba;s/\n/\\n/g')

          # Get failed test details if any - using spec-based approach
          failed_details=""
          if [ "$FAILED_TESTS" -gt 0 ] || [ "$FLAKY_TESTS" -gt 0 ]; then
            failed_details=$(jq -r '
              .suites[].suites[]?.specs[] // empty | 
              select(.title) |
              select(.ok == false or 
                     (.tests[].results | map(.status) | any(. == "failed" or . == "flaky"))) |
              if (.tests[].results | map(.status) | any(. == "failed")) then
                "• " + .title + " (failed)"
              elif (.tests[].results | map(.status) | any(. == "flaky")) then
                "• " + .title + " (flaky)"
              else
                "• " + .title + " (unknown issue)"
              end
            ' $RESULTS_FILE 2>/dev/null | head -5)
            
            # Convert to single line and add header if we have details
            if [ ! -z "$failed_details" ]; then
              failed_details=$(echo "$failed_details" | sed ':a;N;$!ba;s/\n/\\n/g')
              failed_details="\\n\\n**❌ Failed/Flaky Tests:**\\n$failed_details"
            fi
          fi

          latest_url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/$REPORT_TS/"


          # Send comprehensive Teams message
          if [ -z "${{ secrets.TEAMS_WEBHOOK_URL }}" ]; then
            echo "Warning: TEAMS_WEBHOOK_URL secret not configured"
            exit 0
          fi

          curl -H 'Content-Type: application/json' \
            -d "{
              \"text\": \"$EMOJI **DE_Portal Test Results**\\n\\n**$STATUS**\\n\\n📊 **Summary:**\\n• Total: $TOTAL_TESTS tests\\n• Passed: $PASSED_TESTS\\n• Failed: $FAILED_TESTS\\n• Flaky: $FLAKY_TESTS\\n• Skipped: $SKIPPED_TESTS\\n• Duration: ${DURATION_SEC}s (${DURATION_MIN}m)\\n\\n📋 **Test Details:**\\n$summary$failed_details\\n\\n📑 [View Full Report]($latest_url)\\n🔗 [View Workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\\n\\n---\\n👤 **Sent by:** Navaneetha B | 🕐 **Time:** $(TZ='Asia/Kolkata' date +'%a %b %d %Y, %I:%M:%S %p IST')\"
            }" \
            "${{ secrets.TEAMS_WEBHOOK_URL }}"
